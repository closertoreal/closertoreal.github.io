# CI self-tests: this workflow is restricted to the isolated prototype branch.
# It does not deploy or change the website.
name: Change Scope Guard Tests
on:
  push:
    branches:
      - change-control/guard-prototype-20261122
permissions:
  contents: read
jobs:
  scope-guard-tests:
    name: scope-guard-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run deterministic allowlist tests
        run: python3 -m unittest discover -s tools -p 'test_change_scope_guard.py' -v
